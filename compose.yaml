name: front404

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nasa_db
      POSTGRES_USER: nasa
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-front404_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasa -d nasa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./404-Gravity-Not-Found-integration
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --noreload"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-front404-development-only}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: nasa_db
      DATABASE_USER: nasa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-front404_local_dev}
      PIPELINE_DATA_ROOT: /pipeline_data
      DRF_ANON_RATE: 600/min
    volumes:
      - ./404-Gravity-Not-Found-integration/data:/pipeline_data/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
