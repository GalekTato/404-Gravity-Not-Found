[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-resource-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "h5py>=3.10",
  "netCDF4>=1.6",
  "pyhdf>=0.11",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
lazy = ["dask[array]>=2023.10", "xarray>=2023.10", "zarr>=2.16"]

[project.scripts]
geo-pipeline = "pipeline.cli:main"
