<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 54" width="100%" role="img" aria-label="Separador animado de telemetría y sonificación">
  <defs>
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101f29" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f4c552" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#f26b8a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#101f29" stop-opacity="0" />
    </linearGradient>
  </defs>

  <line x1="0" y1="27" x2="1200" y2="27" stroke="url(#waveLine)" stroke-width="1.5" />

  <!-- Ecualizador / pulso armónico central (Círculo de Quintas) -->
  <g transform="translate(540, 27)">
    <rect x="-48" y="-22" width="196" height="44" rx="22" fill="#101f29" stroke="#2a4a61" stroke-width="1.2" />

    <rect x="-26" y="-8" width="5" height="16" rx="2.5" fill="#38bdf8">
      <animate attributeName="height" values="8;24;8" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-12;-4" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="-14" y="-12" width="5" height="24" rx="2.5" fill="#7dd3fc">
      <animate attributeName="height" values="24;10;24" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-12;-5;-12" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <rect x="-2" y="-15" width="5" height="30" rx="2.5" fill="#f4c552">
      <animate attributeName="height" values="12;30;12" dur="1.25s" repeatCount="indefinite" />
      <animate attributeName="y" values="-6;-15;-6" dur="1.25s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="-10" width="5" height="20" rx="2.5" fill="#f26b8a">
      <animate attributeName="height" values="26;10;26" dur="1.55s" repeatCount="indefinite" />
      <animate attributeName="y" values="-13;-5;-13" dur="1.55s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="-7" width="5" height="14" rx="2.5" fill="#38bdf8">
      <animate attributeName="height" values="10;22;10" dur="1.85s" repeatCount="indefinite" />
      <animate attributeName="y" values="-5;-11;-5" dur="1.85s" repeatCount="indefinite" />
    </rect>

    <text x="42" y="4.5" fill="#d9ecff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">
      TERRASYNC · 5tas
    </text>
  </g>
</svg>
