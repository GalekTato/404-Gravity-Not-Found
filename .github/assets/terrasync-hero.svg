<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="TerraSync México — Banner animado">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1620" />
      <stop offset="55%" stop-color="#101f29" />
      <stop offset="100%" stop-color="#173042" />
    </linearGradient>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#1b4965" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#101f29" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="globeSphere" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a6f97" />
      <stop offset="55%" stop-color="#163b52" />
      <stop offset="100%" stop-color="#0b1d2a" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#f4c552" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f26b8a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#f4c552" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f26b8a" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#2a4a61" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Cuadrícula sutil -->
  <g stroke="#25445a" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="255" x2="1200" y2="255" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="960" y1="0" x2="960" y2="340" />
  </g>

  <!-- Estrellas parpadeantes -->
  <g fill="#d9ecff">
    <circle cx="95" cy="54" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="195" cy="278" r="1.8" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="430" cy="48" r="1.3" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="655" cy="304" r="1.6" opacity="0.45">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="810" cy="42" r="1.4" opacity="0.4">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1135" cy="70" r="1.8" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1110" cy="286" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Globo y órbita satelital (derecha) -->
  <g transform="translate(970, 170)">
    <circle r="138" fill="url(#globeGlow)" />

    <!-- Ondas de radar -->
    <circle r="92" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45">
      <animate attributeName="r" values="88;132" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle r="92" fill="none" stroke="#f4c552" stroke-width="1" stroke-opacity="0.35">
      <animate attributeName="r" values="88;132" dur="3.4s" begin="1.7s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.45;0" dur="3.4s" begin="1.7s" repeatCount="indefinite" />
    </circle>

    <!-- Esfera -->
    <circle r="86" fill="url(#globeSphere)" stroke="#4ea8de" stroke-opacity="0.65" stroke-width="1.5" />

    <!-- Meridianos y paralelos giratorios -->
    <g stroke="#7dd3fc" stroke-opacity="0.28" stroke-width="1" fill="none">
      <ellipse rx="86" ry="26" />
      <ellipse rx="86" ry="54" />
      <ellipse rx="32" ry="86">
        <animate attributeName="rx" values="32;62;32" dur="8s" repeatCount="indefinite" />
      </ellipse>
      <ellipse rx="64" ry="86">
        <animate attributeName="rx" values="64;24;64" dur="8s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Puntos de amenaza activos en superficie -->
    <g>
      <circle cx="-20" cy="-14" r="4" fill="#f26b8a">
        <animate attributeName="r" values="3.5;6;3.5" dur="2.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="16" cy="8" r="4" fill="#f4c552">
        <animate attributeName="r" values="3.5;5.8;3.5" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="-4" cy="28" r="4" fill="#38bdf8">
        <animate attributeName="r" values="3.5;6.2;3.5" dur="2.3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Anillo orbital NISAR inclinado -->
    <g transform="rotate(-24)">
      <ellipse rx="124" ry="38" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="7 5" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" />
        <g transform="translate(124, 0)">
          <rect x="-7" y="-3" width="14" height="6" rx="2" fill="#f4c552" />
          <rect x="-15" y="-1.5" width="7" height="3" rx="1" fill="#38bdf8" />
          <rect x="8" y="-1.5" width="7" height="3" rx="1" fill="#38bdf8" />
        </g>
      </g>
    </g>
  </g>

  <!-- Bloque tipográfico principal -->
  <g transform="translate(64, 72)">
    <!-- Etiqueta superior -->
    <rect x="0" y="0" width="276" height="28" rx="14" fill="#173447" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="18" cy="14" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18.5" fill="#bfe9ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.9">
      404 GRAVITY NOT FOUND · ATLAS MX
    </text>

    <!-- Título -->
    <text x="0" y="88" fill="#f8fcff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
      TerraSync
      <tspan fill="#f4c552" font-weight="600"> · México</tspan>
    </text>

    <!-- Línea acento animada -->
    <rect x="0" y="106" width="540" height="2.5" rx="1.25" fill="url(#accentLine)">
      <animate attributeName="width" values="360;580;360" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Subtítulo -->
    <text x="0" y="140" fill="#b7d2e4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Observación satelital multisensor, minería de datos y sonificación por quintas.
    </text>

    <!-- Métricas clave -->
    <g transform="translate(0, 168)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="136" height="32" rx="8" fill="#142b3a" stroke="#2d546e" />
      <text x="14" y="20.5" fill="#38bdf8">32 Estados</text>

      <rect x="148" y="0" width="174" height="32" rx="8" fill="#142b3a" stroke="#2d546e" />
      <text x="162" y="20.5" fill="#f4c552">216 Meses · 2010–2027</text>

      <rect x="334" y="0" width="154" height="32" rx="8" fill="#142b3a" stroke="#2d546e" />
      <text x="348" y="20.5" fill="#f26b8a">3,502 Eventos</text>

      <rect x="500" y="0" width="166" height="32" rx="8" fill="#142b3a" stroke="#2d546e" />
      <text x="514" y="20.5" fill="#d9ecff">32 Pred. / mes 2027</text>
    </g>
  </g>
</svg>
