server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /static/ { alias /django-static/; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location /geojson/ {
        types { application/geo+json geojson; application/json json; }
        try_files $uri =404;
        expires 1h;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
